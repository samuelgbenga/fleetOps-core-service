server:
  port: 8080

spring:
  application:
    name: fleet-core-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleetops_core}
    username: ${DB_USERNAME:fleetops}
    password: ${DB_PASSWORD:fleetops}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: fleet-core-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fleetops.core.kafka.event"

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRY_MS:86400000}
  seed:
    admin:
      name: ${ADMIN_NAME:System Admin}
      email: ${ADMIN_EMAIL:admin@fleetops.com}
      password: ${ADMIN_PASSWORD:Admin@1234}
  vehicle:
    default-milestone-interval: ${DEFAULT_MILESTONE_INTERVAL:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

kafka:
  topics:
    maintenance-flag-created: maintenance.flag.created
    notification-request: notification.request
    vehicle-activity: fleet.activity
