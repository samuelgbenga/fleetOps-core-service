spring:
  datasource:
    url: jdbc:h2:mem:fleettest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: false

  cache:
    type: none

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      fail-fast: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  seed:
    admin:
      name: Test Admin
      email: admin@test.fleetops.com
      password: Admin@1234
  vehicle:
    default-milestone-interval: 3000
  cors:
    allowed-origins: http://localhost:3000

kafka:
  topics:
    notification-request: notification.request
    vehicle-activity: fleet.activity
    maintenance-events: maintenance.events
    breakdown-events: breakdown.events
    company-events: company.events